workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Set Gradle executable
        script: |
          chmod +x ./gradlew

      - name: Build debug APK
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
